
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable"
        content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Notification Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 35px 15px;
    }
    button {
      display: block;
      margin: 20px auto;
      padding: 16px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>iPad Notification Test</h2>

  <button onclick="enableNotifications()">
    1. Enable Notifications
  </button>

  <button onclick="testNotification()">
    2. Show Test Notification
  </button>

  <p id="status">Ready to test</p>

  <script>
    const status = document.getElementById("status");

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .catch(err => status.textContent = err.message);
    }

    async function enableNotifications() {
      if (!("Notification" in window)) {
        status.textContent =
          "Notifications unavailable. Open from Home Screen.";
        return;
      }

      try {
        const permission =
          await Notification.requestPermission();
        status.textContent = "Permission: " + permission;
      } catch (err) {
        status.textContent = "Error: " + err.message;
      }
    }

    async function testNotification() {
      if (!("Notification" in window) ||
          Notification.permission !== "granted") {
        status.textContent = "Enable notifications first.";
        return;
      }

      try {
        const registration =
          await navigator.serviceWorker.ready;

        await registration.showNotification(
          "Teacher Announcement",
          {
            body: "Hello! This is a test notification.",
            tag: "school-test"
          }
        );

        status.textContent =
          "Notification requested. Check your iPad.";
      } catch (err) {
        status.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
